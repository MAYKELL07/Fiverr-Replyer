<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fiverr AI Reply Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h2>Fiverr AI Drafter</h2>
    
    <div class="form-group">
      <label for="apiKey">OpenRouter API Key:</label>
      <input type="password" id="apiKey" placeholder="sk-or-v1-...">
    </div>

    <div class="form-group">
      <label for="model">AI Model:</label>
      <select id="model">
        <option value="google/gemini-2.5-flash">Google: Gemini 2.5 Flash</option>
        <option value="anthropic/claude-3-haiku">Anthropic: Claude 3 Haiku</option>
        <option value="meta-llama/llama-3-8b-instruct:free">Llama 3 8B (Free)</option>
        <option value="google/gemma-7b-it:free">Gemma 7B (Free)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="persona">Your Persona / Rules (System Prompt):</label>
      <textarea id="persona" rows="3" placeholder="e.g., I am a web developer. I write politely and concisely."></textarea>
    </div>

    <div class="form-group">
      <label for="memory">AI Memory (Saved Facts):</label>
      <textarea id="memory" rows="5" placeholder="Saved facts will appear here..."></textarea>
      <small>The AI will read and update this memory automatically based on your conversations.</small>
    </div>

    <div class="actions">
      <button id="saveBtn">Save Settings</button>
      <span id="status" class="status-msg"></span>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
